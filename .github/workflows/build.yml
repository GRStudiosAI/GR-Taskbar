
name: GR Taskbar - Source Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate GR Taskbar Source
    runs-on: windows-2025-vs2026
    timeout-minutes: 15

    steps:
      - name: Checkout GR Taskbar
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: false
          persist-credentials: false

      - name: Display project information
        shell: pwsh
        run: |
          Write-Host "GR Taskbar"
          Write-Host "GR Studios AI LLC"
          Write-Host "Where Imagination Meets Intelligence."
          Write-Host "Repository: $env:GITHUB_REPOSITORY"
          Write-Host "Branch: $env:GITHUB_REF_NAME"
          Write-Host "Commit: $env:GITHUB_SHA"

      - name: Validate repository
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:GITHUB_REPOSITORY -ne "GRStudiosAI/GR-Taskbar") {
              throw "Unexpected repository."
          }

          $required = @(
              "GR-Taskbar.sln",
              "build.proj",
              "LICENSE",
              "GR-Taskbar",
              "gr_gui",
              "gr_setup",
              "gr_dwm",
              "gr_startmenu",
              "gr_starttiledata",
              "GR-Taskbar-L10N",
              "gr_extra",
              "gr_extra_win7alttab"
          )

          foreach ($path in $required) {
              if (-not (Test-Path -LiteralPath $path)) {
                  throw "Missing required component: $path"
              }

              Write-Host "Validated: $path"
          }

      - name: Validate component independence
        shell: pwsh
        run: |
          $entries = git ls-files --stage

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to inspect Git index."
          }

          $unexpected = $entries |
              Where-Object {
                  $_ -match '^160000\s' -and
                  $_ -notmatch '\s+libs/(libvalinet|sws|zlib)$'
              }

          if ($unexpected) {
              $unexpected | Write-Host
              throw "Unexpected external submodule detected."
          }

          Write-Host "Component validation passed."

      - name: Complete source validation
        shell: pwsh
        run: |
          Write-Host "GR Taskbar source validation completed."
          Write-Host "No binaries downloaded."
          Write-Host "No installer generated."
          Write-Host "No artifacts published."
          Write-Host "No release created."
