name: GR Taskbar - Official Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Official release version
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: gr-taskbar-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish existing signed GR Taskbar artifacts

    if: github.repository == 'GRStudiosAI/GR-Taskbar' && github.ref == 'refs/heads/master'

    runs-on: windows-2025-vs2026
    timeout-minutes: 20

    steps:
      - name: Locate successful official build
        id: build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
              throw "Invalid release version."
          }

          $runs = gh run list `
              --repo $env:GITHUB_REPOSITORY `
              --workflow build.yml `
              --branch master `
              --status success `
              --limit 100 `
              --json databaseId,headSha,conclusion |
              ConvertFrom-Json

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to retrieve build runs."
          }

          $selected = $null

          foreach ($run in $runs) {
              $artifacts = gh api `
                  "repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.databaseId)/artifacts?per_page=100" |
                  ConvertFrom-Json

              if ($LASTEXITCODE -ne 0) {
                  throw "Unable to retrieve build artifacts."
              }

              $amd64 = @($artifacts.artifacts | Where-Object {
                  $_.name -eq "GR-Taskbar-Release-amd64-$($run.headSha)" -and
                  -not $_.expired
              })

              $arm64 = @($artifacts.artifacts | Where-Object {
                  $_.name -eq "GR-Taskbar-Release-arm64-$($run.headSha)" -and
                  -not $_.expired
              })

              if ($amd64.Count -eq 1 -and $arm64.Count -eq 1) {
                  $selected = $run
                  break
              }
          }

          if (-not $selected) {
              throw "No successful Release build with both unexpired architecture artifacts was found."
          }

          "run_id=$($selected.databaseId)" >> $env:GITHUB_OUTPUT
          "sha=$($selected.headSha)" >> $env:GITHUB_OUTPUT

          Write-Host "Using successful build: $($selected.databaseId)"
          Write-Host "Source commit: $($selected.headSha)"

      - name: Download signed AMD64 installer
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.build.outputs.run_id }}
          name: GR-Taskbar-Release-amd64-${{ steps.build.outputs.sha }}
          path: artifacts/amd64

      - name: Download signed ARM64 installer
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.build.outputs.run_id }}
          name: GR-Taskbar-Release-arm64-${{ steps.build.outputs.sha }}
          path: artifacts/arm64

      - name: Verify existing signed artifacts
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GR_SIGN_CERT_THUMBPRINT: ${{ vars.GR_SIGN_CERT_THUMBPRINT }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:RELEASE_TAG.Substring(1)

          foreach ($arch in @("amd64", "arm64")) {
              $src = "artifacts/$arch"

              $installer = if ($arch -eq "amd64") {
                  "GR-Taskbar-Setup.exe"
              }
              else {
                  "GR-Taskbar-Setup-ARM64.exe"
              }

              $required = @(
                  $installer,
                  "GR-Taskbar.cat",
                  "GR-Taskbar-Public.cer",
                  "GR-Taskbar-SIGNING-REPORT.json",
                  "SHA256SUMS.txt"
              )

              foreach ($name in $required) {
                  $path = Join-Path $src $name

                  if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                      throw "Missing artifact: $path"
                  }

                  if ((Get-Item -LiteralPath $path).Length -eq 0) {
                      throw "Empty artifact: $path"
                  }
              }

              $verified = @{}

              foreach ($line in Get-Content "$src/SHA256SUMS.txt") {
                  if ([string]::IsNullOrWhiteSpace($line)) {
                      continue
                  }

                  if ($line -notmatch '^([A-Fa-f0-9]{64})\s+\*?([^\\/]+)$') {
                      throw "Invalid checksum entry: $line"
                  }

                  $expected = $Matches[1]
                  $name = $Matches[2].Trim()

                  if ($name -notin $required -or $name -eq "SHA256SUMS.txt") {
                      throw "Unexpected checksum entry: $name"
                  }

                  $file = Join-Path $src $name

                  $actual = (Get-FileHash `
                      -LiteralPath $file `
                      -Algorithm SHA256).Hash

                  if ($actual -ne $expected) {
                      throw "Checksum mismatch: $file"
                  }

                  $verified[$name] = $true
              }

              foreach ($name in $required) {
                  if ($name -ne "SHA256SUMS.txt" -and -not $verified.ContainsKey($name)) {
                      throw "Missing checksum for $name"
                  }
              }

              $report = Get-Content `
                  "$src/GR-Taskbar-SIGNING-REPORT.json" `
                  -Raw | ConvertFrom-Json

              if ($report.CatalogPayloadVerification -ne "Valid") {
                  throw "Catalog verification failed for $arch."
              }

              if ($report.SigningMode -ne "SelfSigned") {
                  throw "Unexpected signing mode for $arch."
              }

              if ($report.TamperDetection -notmatch '^Passed') {
                  throw "Tamper detection verification failed for $arch."
              }

              $public = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
                  (Resolve-Path "$src/GR-Taskbar-Public.cer").Path
              )

              $signature = Get-AuthenticodeSignature `
                  -LiteralPath "$src/$installer"

              if (-not $signature.SignerCertificate) {
                  throw "Installer is unsigned: $installer"
              }

              if ($signature.SignerCertificate.Thumbprint -ne $public.Thumbprint) {
                  throw "Installer signing certificate mismatch."
              }

              if ($env:GR_SIGN_CERT_THUMBPRINT) {
                  $expectedThumbprint = (
                      $env:GR_SIGN_CERT_THUMBPRINT -replace '\s',''
                  ).ToUpperInvariant()

                  if ($public.Thumbprint -ne $expectedThumbprint) {
                      throw "Unexpected signing certificate."
                  }
              }

              if ($signature.Status -notin @("Valid", "NotTrusted")) {
                  throw "Installer signature verification failed: $($signature.Status)"
              }

              if (-not $signature.TimeStamperCertificate) {
                  throw "Installer timestamp is missing."
              }

              $info = (Get-Item "$src/$installer").VersionInfo

              $actualVersion = "{0}.{1}.{2}" -f `
                  $info.ProductMajorPart, `
                  $info.ProductMinorPart, `
                  $info.ProductBuildPart

              if ($actualVersion -ne $version -or $info.ProductPrivatePart -ne 0) {
                  throw "Installer version does not match $version."
              }

              Write-Host "$arch artifacts verified successfully."
          }

          $amd64Cert = (Get-FileHash `
              "artifacts/amd64/GR-Taskbar-Public.cer").Hash

          $arm64Cert = (Get-FileHash `
              "artifacts/arm64/GR-Taskbar-Public.cer").Hash

          if ($amd64Cert -ne $arm64Cert) {
              throw "Architecture signing certificates do not match."
          }

      - name: Prepare official release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory `
              -Path release -Force | Out-Null

          foreach ($arch in @("amd64", "arm64")) {
              $src = "artifacts/$arch"

              $installer = if ($arch -eq "amd64") {
                  "GR-Taskbar-Setup.exe"
              }
              else {
                  "GR-Taskbar-Setup-ARM64.exe"
              }

              Copy-Item "$src/$installer" release

              Copy-Item `
                  "$src/GR-Taskbar.cat" `
                  "release/GR-Taskbar-$arch.cat"

              Copy-Item `
                  "$src/GR-Taskbar-SIGNING-REPORT.json" `
                  "release/GR-Taskbar-SIGNING-REPORT-$arch.json"
          }

          Copy-Item `
              "artifacts/amd64/GR-Taskbar-Public.cer" `
              release

          Get-ChildItem release -File |
              Sort-Object Name |
              ForEach-Object {
                  "{0}  {1}" -f `
                      (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(),
                      $_.Name
              } |
              Set-Content release/SHA256SUMS.txt -Encoding ascii

      - name: Publish official GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:RELEASE_TAG.Substring(1)

          gh release view $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY 2>$null

          if ($LASTEXITCODE -eq 0) {
              throw "Release $env:RELEASE_TAG already exists."
          }

          $files = @(Get-ChildItem release -File |
              ForEach-Object FullName)

          gh release create $env:RELEASE_TAG @files `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:BUILD_SHA `
              --title "GR Taskbar $version" `
              --generate-notes

          if ($LASTEXITCODE -ne 0) {
              throw "GitHub release publication failed."
          }

          Write-Host "GR Taskbar $version published successfully."
