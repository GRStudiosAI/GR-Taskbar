name: Bug Report
description: Report a problem with GR Taskbar.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve GR Taskbar.
        Developed by GR Studios AI LLC.

  - type: input
    id: version
    attributes:
      label: GR Taskbar Version
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows Version and Build
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: System Architecture
      options:
        - x64
        - ARM64
        - x86
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - GR Taskbar
        - GR Settings
        - Start Menu
        - Start Icons
        - Mouse Cursors
        - Windows Explorer
        - Desktop Window Manager
        - Weather
        - Localization
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Screenshots and Diagnostic Logs
      description: Remove personal or confidential information.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched for existing issues.
          required: true
        - label: This issue does not disclose a security vulnerability.
          required: true