name: GR Taskbar - Official Build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: read

concurrency:
  group: gr-taskbar-build-${{ github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_NAME: GR Taskbar
  COMPANY_NAME: GR Studios AI LLC
  BUILD_CONFIGURATION: ${{ inputs.configuration }}

jobs:
  build:
    name: Build and Sign GR Taskbar (${{ matrix.platform }})

    if: github.repository == 'GRStudiosAI/GR-Taskbar' && github.ref == 'refs/heads/master'

    runs-on: windows-2025-vs2026
    timeout-minutes: 120

    environment: release-signing

    strategy:
      fail-fast: false
      matrix:
        platform:
          - amd64
          - arm64

    steps:
      - name: Checkout GR Taskbar
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Validate build requirements
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Get-Command nuget.exe -ErrorAction Stop

          $required = @(
              "GR-Taskbar.sln",
              "build.proj",
              "LICENSE",
              "gr_setup/MicrosoftPayload.targets",
              "gr_setup/ValidateMicrosoftPayload.ps1",
              "scripts/Build-GRTaskbar.ps1",
              "scripts/ReleaseVerification.ps1",
              "scripts/signing/GR-Taskbar-Public.cer",
              "BuildDependencies$env:BUILD_CONFIGURATION.bat"
          )

          foreach ($path in $required) {
              if (-not (Test-Path -LiteralPath $path)) {
                  throw "Missing required file: $path"
              }
          }

          [xml]$targets = Get-Content `
              "gr_setup/MicrosoftPayload.targets" -Raw

          $nodes = @(
              $targets.SelectNodes(
                  "//*[local-name()='GRMicrosoftPayload']"
              )
          )

          if ($nodes.Count -ne 6) {
              throw "Expected six Microsoft dependencies."
          }

          foreach ($node in $nodes) {
              if ($node.ExpectedSHA256 -notmatch '^[A-Fa-f0-9]{64}$') {
                  throw "Unpinned dependency: $($node.Category)"
              }
          }

          Write-Host "All Microsoft dependencies are hash-pinned."

      - name: Import GR Taskbar signing certificate
        shell: powershell
        env:
          GR_SIGN_CERT_BASE64: ${{ secrets.GR_SIGN_CERT_BASE64 }}
          GR_SIGN_CERT_PASSWORD: ${{ secrets.GR_SIGN_CERT_PASSWORD }}
          GR_SIGN_CERT_THUMBPRINT: ${{ vars.GR_SIGN_CERT_THUMBPRINT }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:GR_SIGN_CERT_BASE64) {
              throw "GR_SIGN_CERT_BASE64 is missing."
          }

          if (-not $env:GR_SIGN_CERT_PASSWORD) {
              throw "GR_SIGN_CERT_PASSWORD is missing."
          }

          $thumbprint = (
              "$env:GR_SIGN_CERT_THUMBPRINT" -replace '\s',''
          ).ToUpperInvariant()

          if ($thumbprint -notmatch '^[A-F0-9]{40}$') {
              throw "Invalid signing certificate thumbprint."
          }

          $public = New-Object `
              Security.Cryptography.X509Certificates.X509Certificate2(
                  (Resolve-Path "scripts/signing/GR-Taskbar-Public.cer").Path
              )

          if ($public.Thumbprint -ne $thumbprint) {
              throw "Public certificate thumbprint mismatch."
          }

          $pfx = Join-Path $env:RUNNER_TEMP "GR-Taskbar-Signing.pfx"

          try {
              [IO.File]::WriteAllBytes(
                  $pfx,
                  [Convert]::FromBase64String(
                      $env:GR_SIGN_CERT_BASE64
                  )
              )

              $password = ConvertTo-SecureString `
                  $env:GR_SIGN_CERT_PASSWORD `
                  -AsPlainText -Force

              Import-PfxCertificate `
                  -FilePath $pfx `
                  -CertStoreLocation "Cert:\CurrentUser\My" `
                  -Password $password |
                  Out-Null

              $cert = Get-Item `
                  "Cert:\CurrentUser\My\$thumbprint"

              if (-not $cert.HasPrivateKey) {
                  throw "Signing certificate has no private key."
              }

              if ($cert.NotAfter -le (Get-Date) -or
                  $cert.NotBefore -gt (Get-Date)) {
                  throw "Signing certificate is not current."
              }

              "GR_SIGN_CERT_THUMBPRINT=$thumbprint" |
                  Out-File -FilePath $env:GITHUB_ENV `
                      -Encoding utf8 -Append

              Write-Host "Signing certificate imported successfully."
          }
          finally {
              if (Test-Path -LiteralPath $pfx) {
                  Remove-Item -LiteralPath $pfx -Force
              }
          }

      - name: Build, sign and verify GR Taskbar
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          & ".\scripts\Build-GRTaskbar.ps1" `
              -Configuration $env:BUILD_CONFIGURATION `
              -Platform "${{ matrix.platform }}" `
              -SigningMode SelfSigned `
              -CertificateThumbprint $env:GR_SIGN_CERT_THUMBPRINT

          if (-not $?) {
              throw "Signed build failed."
          }

      - name: Validate signed output
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $output = "release-work/${{ matrix.platform }}/outputs"

          $installer = if ("${{ matrix.platform }}" -eq "amd64") {
              "GR-Taskbar-Setup.exe"
          }
          else {
              "GR-Taskbar-Setup-ARM64.exe"
          }

          $required = @(
              $installer,
              "GR-Taskbar.cat",
              "GR-Taskbar-Public.cer",
              "GR-Taskbar-SIGNING-REPORT.json",
              "SHA256SUMS.txt"
          )

          foreach ($name in $required) {
              $file = Join-Path $output $name

              if (-not (Test-Path -LiteralPath $file)) {
                  throw "Missing signed output: $file"
              }

              if ((Get-Item -LiteralPath $file).Length -eq 0) {
                  throw "Empty output file: $file"
              }
          }

          $report = Get-Content `
              "$output/GR-Taskbar-SIGNING-REPORT.json" `
              -Raw | ConvertFrom-Json

          if ($report.CatalogPayloadVerification -ne "Valid") {
              throw "Payload catalog verification failed."
          }

          if ($report.SigningMode -ne "SelfSigned") {
              throw "Unexpected signing mode."
          }

          Get-ChildItem -LiteralPath $output -File |
              Select-Object Name, Length

      - name: Upload signed GR Taskbar
        uses: actions/upload-artifact@v6
        with:
          name: GR-Taskbar-${{ inputs.configuration }}-${{ matrix.platform }}-${{ github.sha }}
          path: release-work/${{ matrix.platform }}/outputs/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: GR-Taskbar-Diagnostics-${{ matrix.platform }}
          path: |
            release-work/${{ matrix.platform }}/logs/
            **/*.binlog
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove signing certificate
        if: always()
        shell: powershell
        run: |
          $thumbprint = "$env:GR_SIGN_CERT_THUMBPRINT"

          if ($thumbprint -match '^[A-Fa-f0-9]{40}$') {
              $path = "Cert:\CurrentUser\My\$thumbprint"

              if (Test-Path -LiteralPath $path) {
                  Remove-Item -LiteralPath $path `
                      -DeleteKey -Force
              }
          }

          $pfx = Join-Path $env:RUNNER_TEMP "GR-Taskbar-Signing.pfx"

          if (Test-Path -LiteralPath $pfx) {
              Remove-Item -LiteralPath $pfx -Force
          }