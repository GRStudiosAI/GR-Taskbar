name: GR Taskbar - Official Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Official release version
        required: true
        default: v26100.9711.71.16
        type: string
      build_run_id:
        description: Successful GitHub build run ID
        required: true
        default: '46058377152'
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: gr-taskbar-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish existing signed GR Taskbar artifacts

    if: github.repository == 'GRStudiosAI/GR-Taskbar' && github.ref == 'refs/heads/master'

    runs-on: windows-2025-vs2026
    timeout-minutes: 20

    steps:
      - name: Locate completed GitHub build
        id: build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$') {
              throw "Invalid release version."
          }

          if ($env:BUILD_RUN_ID -notmatch '^[0-9]+$') {
              throw "Invalid build run ID."
          }

          $json = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to retrieve GitHub build."
          }

          $run = $json | ConvertFrom-Json

          if ($run.conclusion -ne "success") {
              throw "Selected build was not successful."
          }

          if ($run.path -ne ".github/workflows/build.yml") {
              throw "Selected run is not an official build."
          }

          if ($run.head_branch -ne "master") {
              throw "Selected build is not from master."
          }

          if ($run.head_repository.full_name -ne $env:GITHUB_REPOSITORY) {
              throw "Selected build belongs to another repository."
          }

          $json = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN_ID/artifacts?per_page=100"

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to retrieve GitHub artifacts."
          }

          $artifacts = $json | ConvertFrom-Json

          foreach ($arch in @("amd64", "arm64")) {
              $name = "GR-Taskbar-Release-$arch-$($run.head_sha)"

              $matching = @(
                  $artifacts.artifacts | Where-Object {
                      $_.name -eq $name -and -not $_.expired
                  }
              )

              if ($matching.Count -ne 1) {
                  throw "Missing or expired GitHub artifact: $name"
              }

              Write-Host "Confirmed artifact: $name"
          }

          "run_id=$($run.id)" >> $env:GITHUB_OUTPUT
          "sha=$($run.head_sha)" >> $env:GITHUB_OUTPUT

          Write-Host "Using completed build $($run.id)"
          Write-Host "Original source commit: $($run.head_sha)"

      - name: Checkout original verification tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.build.outputs.sha }}
          persist-credentials: false

      - name: Retrieve existing AMD64 release artifact
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.build.outputs.run_id }}
          name: GR-Taskbar-Release-amd64-${{ steps.build.outputs.sha }}
          path: artifacts/amd64

      - name: Retrieve existing ARM64 release artifact
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.build.outputs.run_id }}
          name: GR-Taskbar-Release-arm64-${{ steps.build.outputs.sha }}
          path: artifacts/arm64

      - name: Verify completed release artifacts
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:RELEASE_TAG.Substring(1)

          $verificationScript = Join-Path `
              $env:GITHUB_WORKSPACE `
              "scripts/ReleaseVerification.ps1"

          if (-not (Test-Path -LiteralPath $verificationScript)) {
              throw "Original verification script is missing."
          }

          . $verificationScript

          $certificatePath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "scripts/signing/GR-Taskbar-Public.cer"

          if (-not (Test-Path -LiteralPath $certificatePath)) {
              throw "Original public certificate is missing."
          }

          $expectedCertificate = `
              [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
                  (Resolve-Path $certificatePath).Path
              )

          $expectedCertificateHash = (
              Get-FileHash -LiteralPath $certificatePath -Algorithm SHA256
          ).Hash

          foreach ($arch in @("amd64", "arm64")) {
              $src = "artifacts/$arch"

              $installer = if ($arch -eq "amd64") {
                  "GR-Taskbar-Setup.exe"
              }
              else {
                  "GR-Taskbar-Setup-ARM64.exe"
              }

              $required = @(
                  $installer,
                  "GR-Taskbar.cat",
                  "GR-Taskbar-Public.cer",
                  "GR-Taskbar-SIGNING-REPORT.json",
                  "SHA256SUMS.txt"
              )

              foreach ($name in $required) {
                  $file = Join-Path $src $name

                  if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
                      throw "Missing release artifact: $file"
                  }

                  if ((Get-Item -LiteralPath $file).Length -eq 0) {
                      throw "Empty release artifact: $file"
                  }
              }

              $verified = @{}

              foreach ($line in Get-Content "$src/SHA256SUMS.txt") {
                  if ([string]::IsNullOrWhiteSpace($line)) {
                      continue
                  }

                  if ($line -notmatch '^([A-Fa-f0-9]{64})\s+\*?([^\\/]+)$') {
                      throw "Invalid checksum entry: $line"
                  }

                  $expected = $Matches[1]
                  $name = $Matches[2].Trim()

                  if ($name -notin $required -or $name -eq "SHA256SUMS.txt") {
                      throw "Unexpected checksum entry: $name"
                  }

                  if ($verified.ContainsKey($name)) {
                      throw "Duplicate checksum entry: $name"
                  }

                  $file = Join-Path $src $name

                  $actual = (
                      Get-FileHash -LiteralPath $file -Algorithm SHA256
                  ).Hash

                  if ($actual -ne $expected) {
                      throw "Checksum mismatch: $file"
                  }

                  $verified[$name] = $true
              }

              foreach ($name in $required) {
                  if ($name -ne "SHA256SUMS.txt" -and
                      -not $verified.ContainsKey($name)) {
                      throw "Missing checksum: $name"
                  }
              }

              $report = Get-Content `
                  "$src/GR-Taskbar-SIGNING-REPORT.json" `
                  -Raw | ConvertFrom-Json

              if ($report.CatalogPayloadVerification -ne "Valid") {
                  throw "Payload catalog verification failed: $arch"
              }

              if ($report.SigningMode -ne "SelfSigned") {
                  throw "Unexpected signing mode: $arch"
              }

              if ($report.TamperDetection -notmatch '^Passed') {
                  throw "Tamper detection verification failed: $arch"
              }

              $artifactCertificateHash = (
                  Get-FileHash `
                      "$src/GR-Taskbar-Public.cer" `
                      -Algorithm SHA256
              ).Hash

              if ($artifactCertificateHash -ne $expectedCertificateHash) {
                  throw "Artifact certificate does not match original build."
              }

              $installerVerification = Test-GRSignature `
                  -Path (Resolve-Path "$src/$installer").Path `
                  -Thumbprint $expectedCertificate.Thumbprint `
                  -Mode SelfSigned

              $installerVerification | Format-List

              $catalogVerification = Test-GRSignature `
                  -Path (Resolve-Path "$src/GR-Taskbar.cat").Path `
                  -Thumbprint $expectedCertificate.Thumbprint `
                  -Mode SelfSigned

              $catalogVerification | Format-List

              $info = (Get-Item "$src/$installer").VersionInfo

              $actualVersion = "{0}.{1}.{2}.{3}" -f `
                  $info.ProductMajorPart, `
                  $info.ProductMinorPart, `
                  $info.ProductBuildPart, `
                  $info.ProductPrivatePart

              $expectedVersion = [version]$version

              if ($expectedVersion.Revision -eq -1) {
                  $expectedVersion = [version]"$version.0"
              }

              Write-Host "Embedded installer version: $actualVersion"
              Write-Host "Expected release version: $expectedVersion"

              if ([version]$actualVersion -ne $expectedVersion) {
                  throw "Installer version $actualVersion does not match $expectedVersion."
              }

              Write-Host "$arch release artifacts verified successfully."
          }

      - name: Prepare GitHub release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory `
              -Path release -Force | Out-Null

          foreach ($arch in @("amd64", "arm64")) {
              $src = "artifacts/$arch"

              $installer = if ($arch -eq "amd64") {
                  "GR-Taskbar-Setup.exe"
              }
              else {
                  "GR-Taskbar-Setup-ARM64.exe"
              }

              Copy-Item `
                  "$src/$installer" `
                  "release/$installer"

              Copy-Item `
                  "$src/GR-Taskbar.cat" `
                  "release/GR-Taskbar-$arch.cat"

              Copy-Item `
                  "$src/GR-Taskbar-SIGNING-REPORT.json" `
                  "release/GR-Taskbar-SIGNING-REPORT-$arch.json"

              $originalHash = (
                  Get-FileHash "$src/$installer" -Algorithm SHA256
              ).Hash

              $releaseHash = (
                  Get-FileHash "release/$installer" -Algorithm SHA256
              ).Hash

              if ($originalHash -ne $releaseHash) {
                  throw "Installer changed during release preparation."
              }
          }

          Copy-Item `
              "artifacts/amd64/GR-Taskbar-Public.cer" `
              "release/GR-Taskbar-Public.cer"

          Get-ChildItem release -File |
              Sort-Object Name |
              ForEach-Object {
                  "{0}  {1}" -f `
                      (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), `
                      $_.Name
              } |
              Set-Content release/SHA256SUMS.txt -Encoding ascii

          Get-ChildItem release -File |
              Select-Object Name, Length

      - name: Generate complete official release description
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_SHA: ${{ steps.build.outputs.sha }}
          BUILD_RUN_ID: ${{ steps.build.outputs.run_id }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:RELEASE_TAG.Substring(1)
          $date = (Get-Date).ToUniversalTime().ToString("MMMM dd, yyyy")
          $repository = "https://github.com/$env:GITHUB_REPOSITORY"
          $shortSha = $env:BUILD_SHA.Substring(0, 12)

          # Retrieve the actual GitHub-generated release changes.
          $generated = gh api --method POST `
              "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" `
              -f "tag_name=$env:RELEASE_TAG" `
              -f "target_commitish=$env:BUILD_SHA"

          $generatedExitCode = $LASTEXITCODE
          $changes = ""

          if ($generatedExitCode -eq 0) {
              $generatedNotes = $generated | ConvertFrom-Json
              $changes = $generatedNotes.body
          }

          # Retrieve source commit history when generated notes
          # are unavailable or contain no useful change details.
          if ([string]::IsNullOrWhiteSpace($changes)) {
              Write-Host "Retrieving source commit history."

              $history = gh api `
                  "repos/$env:GITHUB_REPOSITORY/commits?sha=$env:BUILD_SHA&per_page=30"

              if ($LASTEXITCODE -eq 0) {
                  $commits = $history | ConvertFrom-Json

                  $changes = (
                      $commits | ForEach-Object {
                          $message = ($_.commit.message -split "\r?\n")[0]
                          $commitSha = $_.sha.Substring(0, 7)
                          "- $message ([$commitSha]($repository/commit/$($_.sha)))"
                      }
                  ) -join "`n"
              }
          }

          if ([string]::IsNullOrWhiteSpace($changes)) {
              $changes = "Detailed change history is available in the linked source commit."
          }

          $notes = @"
          # GR Taskbar $version

          Official public release of GR Taskbar by GR Studios AI LLC.

          ## Release Information

          | Property | Details |
          | --- | --- |
          | Product | GR Taskbar |
          | Version | $version |
          | Release Date | $date (UTC) |
          | Developer | GR Studios AI LLC |
          | Release Channel | Official |
          | Architectures | AMD64 (x64) and ARM64 |
          | Signing Mode | Self-signed code signing |
          | Build Run | [$env:BUILD_RUN_ID]($repository/actions/runs/$env:BUILD_RUN_ID) |
          | Source Commit | [$shortSha]($repository/commit/$env:BUILD_SHA) |

          ## About GR Taskbar

          GR Taskbar is a Windows desktop customization project developed by GR Studios AI LLC.

          The project is designed to provide greater control over the Windows taskbar, Start menu, desktop appearance, and personalization experience.

          GR Taskbar incorporates open-source foundations from ExplorerPatcher while maintaining its own branding, development direction, customization features, and release infrastructure.

          ## What's New

          The following changes are generated from the repository's development history.

          $changes

          ## Project Features

          GR Taskbar focuses on the following areas of Windows customization:

          - Taskbar personalization.
          - Start menu customization.
          - Custom Start button icons.
          - Desktop appearance customization.
          - Mouse cursor personalization.
          - Classic Windows-inspired appearance options.
          - Dedicated GR Settings interface.
          - Installer servicing and maintenance.
          - Windows desktop integration.

          Feature availability may depend on the Windows version and configuration.

          ## Available Downloads

          | File | Description |
          | --- | --- |
          | GR-Taskbar-Setup.exe | AMD64 / x64 Windows installer |
          | GR-Taskbar-Setup-ARM64.exe | ARM64 Windows installer |
          | GR-Taskbar-Public.cer | Public code-signing certificate |
          | GR-Taskbar-amd64.cat | AMD64 security catalog |
          | GR-Taskbar-arm64.cat | ARM64 security catalog |
          | GR-Taskbar-SIGNING-REPORT-amd64.json | AMD64 signing verification report |
          | GR-Taskbar-SIGNING-REPORT-arm64.json | ARM64 signing verification report |
          | SHA256SUMS.txt | SHA-256 release file checksums |

          ## Installation

          1. Check your Windows system architecture.
          2. Download the appropriate installer from the Assets section.
          3. Verify the installer checksum and signing information.
          4. Close unnecessary applications and save your work.
          5. Run the appropriate installer.
          6. Follow the installation instructions.
          7. Restart Windows if required by the installer.

          Most Intel and AMD desktop computers use the AMD64 installer.

          Windows computers using ARM processors require the ARM64 installer.

          ## Digital Signatures and Security

          Both installation packages have been verified against the original build's signing certificate.

          Release verification includes:

          - Installer signature verification.
          - Security catalog signature verification.
          - Certificate thumbprint verification.
          - Timestamp verification.
          - SHA-256 artifact integrity verification.
          - Installer product version verification.
          - Original build source commit verification.
          - Validation of build-time tamper detection reports.
          - Validation of build-time payload catalog reports.

          The installers use a self-signed code-signing certificate issued by GR Studios AI LLC.

          Windows may display an untrusted publisher or SmartScreen warning because the certificate is not automatically trusted by Windows.

          Users should verify the publisher, certificate, and SHA-256 checksums before installing. Do not disable Windows security protections to install software.

          ## Release Integrity

          This release was published using previously completed and verified GitHub build artifacts.

          The release workflow does not rebuild, modify, or re-sign the original installers.

          The SHA256SUMS.txt file contains SHA-256 checksums for the published release assets.

          ## Build and Verification Status

          | Verification | Result |
          | --- | --- |
          | Original build | Successful |
          | AMD64 artifacts | Verified |
          | ARM64 artifacts | Verified |
          | Installer signatures | Verified |
          | Catalog signatures | Verified |
          | Certificate identity | Verified |
          | Artifact checksums | Verified |
          | Product versions | Verified |
          | Build-time tamper detection | Passed |
          | Build-time payload catalog validation | Passed |

          ## Compatibility and Known Issues

          Windows customization behavior may vary between Windows versions, system configurations, and installed updates.

          Review the project documentation and issue tracker for current compatibility information and known issues.

          ## Support and Documentation

          - [Official GR Taskbar repository]($repository)
          - [Project documentation]($repository/wiki)
          - [Report a bug]($repository/issues)
          - [Community discussions]($repository/discussions)
          - [Release history]($repository/releases)
          - [Source code]($repository/tree/$env:BUILD_SHA)
          - [Original GitHub build]($repository/actions/runs/$env:BUILD_RUN_ID)

          ## Licensing and Acknowledgments

          GR Taskbar incorporates open-source work from ExplorerPatcher and its contributors.

          Applicable upstream licenses, copyright notices, and acknowledgments remain part of the project.

          Refer to the repository's licensing documentation for applicable terms.

          ---

          **GR Studios AI LLC**

          *Where Imagination Meets Intelligence.*

          Official GR Taskbar Release $version
          "@

          $notes | Set-Content `
              -LiteralPath RELEASE_NOTES.md `
              -Encoding utf8

          if (-not (Test-Path -LiteralPath RELEASE_NOTES.md)) {
              throw "Release description generation failed."
          }

          if ((Get-Item RELEASE_NOTES.md).Length -eq 0) {
              throw "Generated release description is empty."
          }

          Write-Host "Complete release description generated successfully."

          Get-Content RELEASE_NOTES.md

      - name: Publish official GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GR_RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_SHA: ${{ steps.build.outputs.sha }}
          BUILD_RUN_ID: ${{ steps.build.outputs.run_id }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:RELEASE_TAG.Substring(1)

          $files = @(
              Get-ChildItem release -File |
                  ForEach-Object FullName
          )

          if ($files.Count -ne 8) {
              throw "Unexpected number of release assets: $($files.Count)"
          }

          if (-not (Test-Path -LiteralPath RELEASE_NOTES.md -PathType Leaf)) {
              throw "Generated release description is missing."
          }

          $tagCommit = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:RELEASE_TAG" --jq ".sha" 2>$null

          if ($LASTEXITCODE -ne 0) {
              Write-Host "Creating release tag at original build commit."

              gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" `
                  -f "ref=refs/tags/$env:RELEASE_TAG" `
                  -f "sha=$env:BUILD_SHA"

              if ($LASTEXITCODE -ne 0) {
                  throw "GitHub denied tag creation. Configure GR_RELEASE_TOKEN with repository Contents read/write permission."
              }
          }

          $tagCommit = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:RELEASE_TAG" --jq ".sha"

          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:BUILD_SHA) {
              throw "Release tag does not match the original build commit."
          }

          gh release view $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY 2>$null

          if ($LASTEXITCODE -eq 0) {
              throw "Release $env:RELEASE_TAG already exists."
          }

          gh release create $env:RELEASE_TAG @files `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --title "GR Taskbar $version" `
              --notes-file RELEASE_NOTES.md

          if ($LASTEXITCODE -ne 0) {
              throw "GitHub denied release publication. Check GR_RELEASE_TOKEN permissions."
          }

          Write-Host "GR Taskbar $version published successfully."
          Write-Host "Published existing build: $env:BUILD_RUN_ID"
          Write-Host "Complete release description published."
          Write-Host "No rebuilding or re-signing performed."
