name: GR Taskbar - Official Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release version tag (e.g. v1.0.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gr-taskbar-release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'GRStudiosAI/GR-Taskbar' && github.ref == 'refs/heads/master'
    runs-on: windows-2025-vs2026
    environment: release-signing
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v3
      - name: Sign and build
        shell: powershell
        env:
          GR_SIGN_CERT_THUMBPRINT: ${{ vars.GR_SIGN_CERT_THUMBPRINT }}
        run: |
          if (-not $env:GR_SIGN_CERT_THUMBPRINT) { throw 'Signing certificate thumbprint is not configured.' }
          if (-not (Test-Path "Cert:\CurrentUser\My\$env:GR_SIGN_CERT_THUMBPRINT")) { throw 'Signing certificate is not provisioned on this runner.' }
          & .\scripts\build-gr-taskbar-release.bat '${{ matrix.platform }}'
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.platform }}
          path: release-work/${{ matrix.platform }}/outputs/
          if-no-files-found: error
  draft:
    needs: build
    runs-on: windows-2025-vs2026
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: artifacts
      - name: Prepare draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v?[0-9]+(\.[0-9]+){1,3}$') { throw 'Invalid release tag.' }
          New-Item -ItemType Directory -Path release | Out-Null
          foreach ($arch in @('amd64','arm64')) {
            $src = "artifacts/release-$arch"
            $installer = if ($arch -eq 'amd64') { 'GR-Taskbar-Setup.exe' } else { 'GR-Taskbar-Setup-ARM64.exe' }
            Copy-Item "$src/$installer" release -ErrorAction Stop
            Copy-Item "$src/GR-Taskbar.cat" "release/GR-Taskbar-$arch.cat" -ErrorAction Stop
            Copy-Item "$src/GR-Taskbar-SIGNING-REPORT.json" "release/GR-Taskbar-SIGNING-REPORT-$arch.json" -ErrorAction Stop
          }
          Copy-Item artifacts/release-amd64/GR-Taskbar-Public.cer release -ErrorAction Stop
          Get-ChildItem release -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } | Set-Content release/SHA256SUMS.txt -Encoding ascii
          $files = @(Get-ChildItem release -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title "GR Taskbar $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed.' }
